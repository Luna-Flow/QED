name: Lean Typed HOL

on:
  pull_request:
    paths:
      - 'formal_verification/**'
      - 'doc/attachments/qed_formal_spec.typ'
      - 'formal_verification/theory-proof-plan.md'
      - 'doc/manual/qed_obligations.json'
      - 'doc/manual/conformance.md'
      - 'tools/qed_obligations.py'
      - 'tools/qed_formal_gate.py'
      - 'tools/test_qed_formal_gate.py'
      - 'tools/test_qed_obligations.py'
      - 'tools/qed_lean_conformance.py'
      - 'tools/test_qed_lean_conformance.py'
      - 'src/**'
      - '.github/workflows/lean.yml'
  push:
    branches: [main]
    paths:
      - 'formal_verification/**'
      - 'doc/attachments/qed_formal_spec.typ'
      - 'formal_verification/theory-proof-plan.md'
      - 'doc/manual/qed_obligations.json'
      - 'doc/manual/conformance.md'
      - 'tools/qed_obligations.py'
      - 'tools/qed_formal_gate.py'
      - 'tools/test_qed_formal_gate.py'
      - 'tools/test_qed_obligations.py'
      - 'tools/qed_lean_conformance.py'
      - 'tools/test_qed_lean_conformance.py'
      - 'src/**'
      - '.github/workflows/lean.yml'

jobs:
  typed-hol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate proof-obligation matrix
        run: python3 tools/qed_obligations.py
      - name: Test formal gate rejection paths
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check Lean constructor coverage by MoonBit tests
        run: python3 tools/qed_lean_conformance.py
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal_verification
          build: true
      - name: Check Lean proof admissions and axiom dependencies
        run: python3 tools/qed_formal_gate.py
